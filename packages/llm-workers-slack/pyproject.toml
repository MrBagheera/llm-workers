[project]
name = "llm-workers-slack"
version = "1.1.4"
description = "Slack Bolt Socket Mode integration for LLM Workers"
authors = [
    {name = "Dmitry Mikhaylov", email = "mikhailov.dmitry@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "llm-workers (==1.1.4)",
    "slack-bolt (>=1.22.0,<2.0.0)",
    "aiohttp (>=3.9.0,<4.0.0)",
    "langchain-core (>=1.0.0,<2.0.0)",
]

[project.scripts]
llm-workers-slack = "llm_workers_slack.slack_main:main"

[project.urls]
Homepage = "https://mrbagheera.github.io/llm-workers/"
Issues = "https://github.com/MrBagheera/llm-workers/issues"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "llm_workers_slack", from = "src"}]
